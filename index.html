<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okik Sips - Order Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <div class="header">
    <h2>🍷 Okik Sips</h2>
    <p>100% Natural • No Artificial Preservatives</p>
  </div>

  <div class="container">
    <h3>Place Your Order</h3>

    
   
<div class="product-card">
  <img src="Zobo Drink.jpeg" alt="Zobo Drink" class="product-img">
  <div class="product-info">
    <h4>Zobo Drink</h4>
    <p>Refreshing, Nutritious & Naturally Delicious</p>
    <div class="qty-picker">
      <label for="zoboQty">Qty:</label>
      <input type="number" id="zoboQty" value="0" min="0">
    </div>
  </div>
</div>


<div class="product-card">
  <img src="Tigernut drink.jpeg" alt="Tigernut Drink" class="product-img">
  <div class="product-info">
    <h4>Tigernut Drink</h4>
    <p>Creamy, Healthy & Naturally Sweet</p>
    <div class="qty-picker">
      <label for="tigernutQty">Qty:</label>
      <input type="number" id="tigernutQty" value="0" min="0">
    </div>
  </div>
</div>

    
    <div class="form-group">
      <label for="orderType"><b>Order Type:</b></label>
      <select id="orderType">
        <option value="Delivery">Delivery</option>
        <option value="Pickup">Pickup</option>
      </select>
    </div>

    <div class="form-group">
      <label for="custName"><b>Your Name:</b></label>
      <input type="text" id="custName" placeholder="Enter your full name">
    </div>

    <div class="form-group">
      <label for="custAddress"><b>Delivery Address:</b></label>
      <input type="text" id="custAddress" placeholder="Enter your address">
    </div>

    
    <button class="order-btn" onclick="sendToWhatsapp()">Order via WhatsApp</button>
  </div>
  <footer class="footer">
    <p>&copy; 2026 Okik Sips. All rights reserved.</p>
    <p>Designed by <span>Silky Dave</span></p>
  </footer>

  <script src="index.js"></script>
</body>
</html>
